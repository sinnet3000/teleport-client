name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BINARY=teleport-client
          COMMIT=${GITHUB_SHA::8}
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"
          DIST_DIR=dist

          mkdir -p ${DIST_DIR}

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "freebsd/amd64"
            "freebsd/arm64"
            "openbsd/amd64"
            "openbsd/arm64"
          )

          for platform in "${platforms[@]}"; do
            OS=$(echo $platform | cut -f1 -d'/')
            ARCH=$(echo $platform | cut -f2 -d'/')
            OUTPUT="${BINARY}_${OS}_${ARCH}"

            if [ "$OS" = "windows" ]; then
              OUTPUT="${OUTPUT}.exe"
            fi

            echo "Building ${OS}/${ARCH}..."
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o ${DIST_DIR}/${OUTPUT} .
          done

          # Create checksums
          cd ${DIST_DIR}
          sha256sum * > checksums.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/teleport-client_* \
            dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
